<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IEEE Essential Patent Claims Flowchart</title>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/svg2pdf.js@2.8.1/dist/svg2pdf.umd.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #ffffff;
      margin: 0;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .toolbar {
      margin-bottom: 16px;
    }
    button {
      background-color: #1155cc;
      color: #ffffff;
      border: none;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0d42a1;
    }
    .mermaid {
      max-width: 100%;
    }
    @media print {
      .toolbar { display: none; }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <button id="download-pdf">Download Vector PDF</button>
  </div>

  <pre class="mermaid">
    <!-- PASTE YOUR flowchart TD CODE HERE -->
  </pre>

  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
    mermaid.initialize({
      startOnLoad: true,
      flowchart: { htmlLabels: false }
    });

    document.getElementById('download-pdf').addEventListener('click', async () => {
      const svg = document.querySelector('.mermaid svg');
      if (!svg) return;

      const vb = svg.viewBox.baseVal;
      const rawW = (vb && vb.width) ? vb.width : svg.getBoundingClientRect().width;
      const rawH = (vb && vb.height) ? vb.height : svg.getBoundingClientRect().height;
      const pad = 20;
      const width = Math.ceil(rawW + pad * 2);
      const height = Math.ceil(rawH + pad * 2);

      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({
        orientation: width > height ? 'l' : 'p',
        unit: 'pt',
        format: [width, height]
      });

      await doc.svg(svg, { x: pad, y: pad, width: rawW, height: rawH });
      doc.save('ieee-patent-flowchart.pdf');
    });
  </script>
</body>
</html>
